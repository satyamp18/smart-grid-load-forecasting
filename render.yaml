services:
  - type: web
    name: smart-grid-api
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn smartgrid.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SKIP_DB_INIT
        value: "false"